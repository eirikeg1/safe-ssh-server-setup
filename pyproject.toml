[project]
name = "safe-ssh-setup"
version = "0.1.0"
description = "TUI wizard for hardening SSH servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eirik Eggset" }]
keywords = ["ssh", "hardening", "security", "tui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=1.0.0",
    # Used directly by the diff and step-indicator widgets, not just via textual.
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/eirikeg1/safe-ssh-server-setup"

[project.scripts]
safe-ssh-setup = "safe_ssh_setup.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safe_ssh_setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
